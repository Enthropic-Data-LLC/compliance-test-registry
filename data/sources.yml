# Authoritative source registry for currency checking.
#
# One entry per framework directory under compliance_entities/. Each entry records
# the version this registry ASSERTS, and where the authoritative published version
# can be checked. `tools/check_source_currency.py` reads this file and reports drift.
#
# Fields
#   id            Path under compliance_entities/ (the framework's directory)
#   name          Human-readable framework name
#   authority     Publishing body
#   asserted      The version/revision string this registry claims to cover
#   asserted_as_of  Date the registry content was last reviewed against the source
#   method        How currency is checked:
#                   ecfr    — eCFR versioner API; authoritative per-part amendment dates
#                   regex   — fetch `url`, extract a version marker with `pattern`
#                   hash    — fetch `url`, hash the extracted text; report if it changed
#                   manual  — paywalled or no stable public marker; human review only
#   url           Authoritative source page (informational for ecfr/manual entries)
#   title/parts   eCFR title number and part list (method: ecfr only)
#   pattern       Regex with one capture group yielding the version (method: regex only)
#   notes         Why a method was chosen, or what a human must check
#
# Adding a framework: add an entry here. check_source_currency.py fails if any
# framework directory lacks one, so this file cannot silently fall behind the registry.

